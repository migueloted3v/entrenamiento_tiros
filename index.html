<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0F1D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiros">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Entrenamiento de tiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F5; --surface:#FFFFFF; --surface-2:#F3F6FA;
  --ink:#0F1D3A; --ink-soft:#5B6B87; --line:#D3DAE5; --line-strong:#A4B0C5;
  --accent:#1D428A; --gold:#FFC72C; --cyan:#16356E; --made:#0E7C50; --miss:#C4213A;
  --shadow:0 1px 0 rgba(15,29,58,.10), 0 8px 24px -18px rgba(15,29,58,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1226; --surface:#131D33; --surface-2:#1B2740; --ink:#E8ECF4;
    --ink-soft:#93A1BC; --line:#29344F; --line-strong:#44526F; --accent:#6C9BE8;
    --gold:#FFC72C; --cyan:#FFC72C; --made:#12A167; --miss:#E0455C;
    --shadow:0 1px 0 rgba(0,0,0,.5), 0 10px 26px -18px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1226; --surface:#131D33; --surface-2:#1B2740; --ink:#E8ECF4;
  --ink-soft:#93A1BC; --line:#29344F; --line-strong:#44526F; --accent:#6C9BE8;
  --gold:#FFC72C; --cyan:#FFC72C; --made:#12A167; --miss:#E0455C;
  --shadow:0 1px 0 rgba(0,0,0,.5), 0 10px 26px -18px #000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,sans-serif;
     font-size:16px;line-height:1.45;overscroll-behavior:none}
#root{min-height:100dvh}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
h1,h2{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:700;margin:0}

.safetop{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#0F1D3A;z-index:50;pointer-events:none}
.wrap{max-width:520px;margin:0 auto;
  padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.masthead h1{font-size:38px;line-height:.95}
.masthead p{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.sync{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;color:var(--ink-soft);
      border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.sync.on{color:var(--cyan);border-color:var(--cyan)}
.sync.pend{color:var(--accent);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:20px;margin-bottom:10px}
.hint{color:var(--ink-soft);font-size:13.5px;margin:0}

.courtbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:14px;box-shadow:var(--shadow)}
.court{display:block;width:100%;height:auto}
.c-line{fill:none;stroke:var(--line-strong);stroke-width:1.6}
.c-line.dash{stroke-dasharray:5 5}
.c-line.ft{stroke:var(--accent);stroke-width:2.4}
.c-tick{fill:none;stroke:var(--line-strong);stroke-width:1}
.c-hoop{fill:none;stroke:var(--ink-soft);stroke-width:2.2}
.ray{stroke:var(--accent);stroke-width:1.2;opacity:.45}
.ray.on{stroke:var(--accent);stroke-width:2.4;opacity:1}
.dot{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.dot.sel{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.dot.done{fill:var(--ink-soft);stroke:var(--ink-soft)}
.dot.on{fill:var(--accent);stroke:var(--accent)}
.dot-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;fill:var(--ink-soft);text-anchor:middle;dominant-baseline:central}
.dot-t.sel{fill:var(--accent)}
.dot-t.on,.dot-t.done{fill:var(--surface)}
.dot-p{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.pick{cursor:pointer}
.cellbtn{display:block;width:100%;padding:0;background:none;border:none}
.record{display:flex;align-items:baseline;gap:8px;background:var(--surface-2);border-radius:11px;padding:10px 12px;margin:10px 0 14px}
.record .r{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1;color:var(--gold)}
.record .d{color:var(--ink-soft);font-size:13px}
.ray-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;fill:var(--line-strong);text-anchor:middle;dominant-baseline:central}
.ray-t.on{fill:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 15px;font-weight:500;font-size:15px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.chip.ghost{border-style:dashed;color:var(--ink-soft)}
.posrow{display:flex;gap:8px}
.posbtn{flex:1;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 0;
        font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1}
.posbtn.on{border-color:var(--gold);background:var(--gold);color:#0F1D3A}
.newrow{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=url]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface-2);
  border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.stepper{display:flex;align-items:center;gap:14px}
.step-btn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:600;display:grid;place-items:center}
.step-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;line-height:1;min-width:52px;text-align:center}
.step-side{color:var(--ink-soft);font-size:13.5px;line-height:1.3}

.btn{display:block;width:100%;border-radius:13px;padding:15px;font-weight:600;font-size:17px;text-align:center;border:1.5px solid transparent}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-quiet{background:var(--surface);border-color:var(--line)}
.btn-danger{background:var(--surface);border-color:var(--miss);color:var(--miss)}
.btn+.btn{margin-top:9px}
.btn:disabled{opacity:.35}

.hist{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:none}
.hist-pct{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;min-width:62px}
.hist-main{flex:1;min-width:0}
.hist-main b{font-weight:600;font-size:15.5px}
.hist-main span{display:block;color:var(--ink-soft);font-size:13px}

.cap{display:flex;flex-direction:column;height:100dvh}
.cap-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.cap-court{width:58px;flex:none}
.cap-id{flex:1;min-width:0}
.cap-id .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;line-height:1}
.cap-id .sub{color:var(--ink-soft);font-size:12.5px;margin-top:1px}
.pips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pip{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-strong)}
.pip.m{background:var(--made);border-color:var(--made)}
.pip.x{background:var(--miss);border-color:var(--miss)}
.cap-run{text-align:right;flex:none}
.cap-run .r1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;line-height:1}
.cap-run .r2{font-size:10.5px;color:var(--ink-soft)}
.cap-run .r3{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;line-height:1;margin-top:7px;color:var(--ink-soft)}
.pips.fail{margin-top:5px}

.halves{flex:1;display:flex;flex-direction:column;min-height:0}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;user-select:none;transition:filter .08s}
.half:active{filter:brightness(1.22)}
.half.made{background:var(--made)}
.half.miss{background:var(--miss)}
.half .lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1}
.half .cnt{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:30px;opacity:.8;line-height:1.15}
.cap-bar{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
.cap-bar button{flex:1;padding:13px 4px;font-size:14.5px;font-weight:500;color:var(--ink-soft)}
.cap-bar button+button{border-left:1px solid var(--line)}

.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:flex-end;z-index:20}
.sheet-in{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet-in h2{font-size:26px}
.score-line{display:flex;align-items:baseline;gap:10px;margin:8px 0 14px}
.score-line .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:52px;line-height:1;color:var(--accent)}
.score-line .side{color:var(--ink-soft);font-size:14px}
.pause{position:fixed;inset:0;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}
.pause .p1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px}
.pause .p2{opacity:.7;font-size:15px;margin-bottom:20px}
.pause .p3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:62px;font-variant-numeric:tabular-nums}
.pause button{margin-top:24px;background:var(--paper);color:var(--ink);border-radius:13px;padding:15px 44px;font-weight:600;font-size:18px}

.headline{display:flex;align-items:flex-end;gap:14px;margin:2px 0 6px}
.headline .pct{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:74px;line-height:.85;color:var(--accent)}
.headline .meta{color:var(--ink-soft);font-size:14px;padding-bottom:6px}
.grid{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.grid th{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;color:var(--ink-soft);padding:0 0 2px}
.cell{border-radius:8px;padding:7px 2px;text-align:center;color:#fff}
.cell .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;line-height:1}
.cell .s{font-size:10.5px;opacity:.82;line-height:1.2}
.cell.empty{background:var(--surface-2);color:var(--ink-soft)}
.cell.tot{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.cell.gt{background:var(--accent);color:#fff}
.grid th.tot{color:var(--accent);font-weight:700;font-size:12px}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:6px 1px;text-align:center}
.tbl th.rowh{text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--ink);width:34px}
.tbl th.tot{color:var(--accent);font-weight:700}
.tbl td{text-align:center;font-size:13px;color:var(--ink-soft);padding:7px 1px;border-bottom:1px solid var(--surface-2)}
.tbl td.last{color:var(--ink);font-weight:600}
.tbl td.tot{color:var(--accent);font-weight:700}
.tbl tr.totrow td{border-bottom:none;color:var(--ink);font-weight:700;padding-top:9px}
.tbl tr.totrow td.gt{background:var(--accent);color:#fff;border-radius:6px}
.zlab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;fill:#fff;text-anchor:middle;pointer-events:none}
.zlab.off{fill:var(--ink-soft)}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-row .k{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;width:16px}
.bar-track{flex:1;height:11px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-row .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;width:52px;text-align:right}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:96px;background:var(--surface-2);border-radius:11px;padding:11px 12px}
.stat .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;line-height:1}
.stat .l{color:var(--ink-soft);font-size:12.5px;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:14.5px;z-index:40;max-width:90%;text-align:center}
.back{color:var(--ink-soft);font-size:15px;margin-bottom:8px;padding:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="safetop"></div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

const LINES=["A","B","C","D","E"], POS=[1,2,3,4,5];
const ANGLES=[90,45,0,-45,-90], RADII=[46,72,98,124,150], HOOP={x:45,y:195};
const K_PLAYERS="cl_players", K_SESSIONS="cl_sessions", K_PEND="cl_pending", K_URL="cl_sync_url", K_CFG="cl_cfg", K_GAMES="cl_games", K_GPEND="cl_gpending";

const rad=d=>d*Math.PI/180;
const pt=(a,r)=>({x:HOOP.x+r*Math.cos(rad(a)),y:HOOP.y+r*Math.sin(rad(a))});
const pct=(m,t)=>t?Math.round(m/t*100):null;
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const load=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(e){return fb}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const heat=p=>`hsl(${4+138*p} 52% ${38+6*Math.abs(.5-p)}%)`;
const fecha=iso=>{const d=new Date(iso);return d.toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})};
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

const agg=(shots,f)=>{const c=shots.filter(f);return {t:c.length,m:c.filter(x=>x.made).length}};
const isFT=s=>s.line===5;
function sessionStats(s){
  const tiro=s.shots.filter(x=>!isFT(x)), ft=s.shots.filter(isFT);
  return {tiro:{t:tiro.length,m:tiro.filter(x=>x.made).length},
          ft:{t:ft.length,m:ft.filter(x=>x.made).length},
          all:{t:s.shots.length,m:s.shots.filter(x=>x.made).length}};
}

function ftSplit(shots,target){
  const tl=shots.filter(isFT);
  let m=0,corte=-1;
  tl.forEach((s,i)=>{ if(s.made){ m++; if(m===target&&corte<0) corte=i; } });
  const first = corte<0?tl:tl.slice(0,corte+1);
  const extra = corte<0?[]:tl.slice(corte+1);
  let r=0,best=0; tl.forEach(s=>{ if(s.made){r++;best=Math.max(best,r)} else r=0 });
  return {tl:{t:tl.length,m:tl.filter(x=>x.made).length},
          first:{t:first.length,m:first.filter(x=>x.made).length,completo:corte>=0},
          extra:{t:extra.length,m:extra.filter(x=>x.made).length},
          racha:best};
}
function marcaHistorica(sessions,player,excluir){
  let best=null;
  sessions.forEach(s=>{
    if(s.playerName!==player||s.id===excluir) return;
    const r=ftSplit(s.shots,s.ftTarget||10).racha;
    if(r>0&&(!best||r>best.racha)) best={racha:r,fecha:s.startedAt};
  });
  return best;
}
const PX_M=22, ARO={x:45,y:195};
const ZONA_NOM={RA:"Área restringida",PAINT:"Pintura",MID:"Media distancia",C3:"Triple de esquina",ATB:"Triple sobre el arco"};
const ZONAS=["RA","PAINT","MID","C3","ATB"];
function zonaDe(x,y){
  const dx=x-ARO.x, dy=y-ARO.y, r=Math.sqrt(dx*dx+dy*dy);
  if(x<=77&&Math.abs(dy)>=145) return "C3";
  if(r>=148.5) return "ATB";
  if(r<=27.5) return "RA";
  if(x<=138&&y>=141&&y<=249) return "PAINT";
  return "MID";
}
const esTriple=z=>z==="C3"||z==="ATB";
const distM=(x,y)=>Math.sqrt(Math.pow(x-ARO.x,2)+Math.pow(y-ARO.y,2))/PX_M;
const puntosDe=s=>(s.made?(esTriple(s.zona)?3:2):0)+(s.ftM||0);
function boxScore(shots){
  const tc={t:shots.length,m:shots.filter(s=>s.made).length};
  const t3s=shots.filter(s=>esTriple(s.zona));
  const t3={t:t3s.length,m:t3s.filter(s=>s.made).length};
  const tl={t:shots.reduce((a,s)=>a+(s.ftA||0),0),m:shots.reduce((a,s)=>a+(s.ftM||0),0)};
  const pts=shots.reduce((a,s)=>a+puntosDe(s),0);
  return {tc,t3,tl,pts,pps:tc.t?pts/tc.t:0};
}
function porZona(shots){
  const o={}; ZONAS.forEach(z=>o[z]={m:0,t:0});
  shots.forEach(s=>{ if(!o[s.zona])o[s.zona]={m:0,t:0}; o[s.zona].t++; if(s.made)o[s.zona].m++; });
  return o;
}
const MIN_ZONA=6;

const ritmoDe=arr=>{
  const g=arr.map(s=>s.gap).filter(x=>typeof x==="number"&&x>0&&x<120000);
  return g.length?(g.reduce((a,b)=>a+b,0)/g.length/1000):null;
};

/* ---------- sincronización con Google Sheets ---------- */
const syncUrl=()=>{try{return localStorage.getItem(K_URL)||""}catch(e){return""}};
async function pushRemote(session){
  const url=syncUrl(); if(!url) throw new Error("sin url");
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(session.rival?{accion:"guardar_juego",juego:session}:{accion:"guardar",jornada:session})});
  const j=await r.json();
  if(!j||j.ok!==true) throw new Error((j&&j.error)||"respuesta inesperada");
  return true;
}
async function pullRemote(){
  const url=syncUrl(); if(!url) return null;
  const r=await fetch(url+(url.includes("?")?"&":"?")+"accion=leer");
  const j=await r.json();
  return {jornadas:Array.isArray(j.jornadas)?j.jornadas:null,
          juegos:Array.isArray(j.juegos)?j.juegos:null};
}
function mergeSessions(a,b){
  const map=new Map();
  [...a,...b].forEach(s=>{if(!map.has(s.id)||s.shots.length>map.get(s.id).shots.length)map.set(s.id,s)});
  return [...map.values()].sort((x,y)=>String(y.startedAt).localeCompare(String(x.startedAt)));

      <line className="c-hoop" x1="36" y1="175" x2="36" y2="215"/>
      <line className="c-hoop" x1="36" y1="195" x2="39.5" y2="195"/>
      <circle className="c-hoop" cx="45" cy="195" r="5.5"/>
      {!juego&&ANGLES.map((a,i)=>{
        const p1=pt(a,36),p2=pt(a,162),lt=pt(a,178),on=line===i;
        return (
          <g key={i}>
            <line className={"ray"+(on?" on":"")} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}/>
            <text className={"ray-t"+(on?" on":"")} x={lt.x} y={Math.min(381,Math.max(13,lt.y))}>{LINES[i]}</text>
            {RADII.map((r,j)=>{
              const c=pt(a,r);
              if(mapa){
                const d=mapa[i+"-"+j];
                if(!d) return <circle key={j} className="dot" cx={c.x} cy={c.y} r={4.5}/>;
                const p=d.m/d.t;
                return (<g key={j} className="pick" onClick={()=>onPick&&onPick(i,j)}>
                  <circle cx={c.x} cy={c.y} r={12.5} fill={heat(p)}/>
                  <text className="dot-p" x={c.x} y={c.y}>{Math.round(p*100)}</text>
                </g>);
              }
              const isSel=sel.indexOf(j)>=0; if(compact&&!isSel) return null;
              const isOn=on&&pos===j, isDone=!!done[i+"-"+j];
              const cls=isOn?" on":isDone?" done":isSel?" sel":"";
              return (<g key={j}>
                <circle className={"dot"+cls} cx={c.x} cy={c.y} r={isOn?11:9.5}/>
                <text className={"dot-t"+cls} x={c.x} y={c.y}>{j+1}</text>
              </g>);
            })}
          </g>
        );
      })}
      {tiros&&tiros.map((s,i)=> s.made
        ? <circle key={i} cx={s.x} cy={s.y} r="7" fill="#FFFFFF" stroke="#16181c" strokeWidth="1.4"/>
        : <circle key={i} cx={s.x} cy={s.y} r="7" fill="none" stroke="#16181c" strokeWidth="2.2"/>)}
      {marca&&<g>
        <circle cx={marca.x} cy={marca.y} r="16" fill="none" stroke="var(--gold)" strokeWidth="2.5"/>
        <line x1={marca.x} y1={marca.y-22} x2={marca.x} y2={marca.y-10} stroke="var(--gold)" strokeWidth="2.5"/>
        <line x1={marca.x} y1={marca.y+10} x2={marca.x} y2={marca.y+22} stroke="var(--gold)" strokeWidth="2.5"/>
        <line x1={marca.x-22} y1={marca.y} x2={marca.x-10} y2={marca.y} stroke="var(--gold)" strokeWidth="2.5"/>
        <line x1={marca.x+10} y1={marca.y} x2={marca.x+22} y2={marca.y} stroke="var(--gold)" strokeWidth="2.5"/>
      </g>}
    </svg>
  );
}

/* ---------- inicio ---------- */
function Home({players,addPlayer,playerId,setPlayerId,cfg,setCfg,sessions,games,onStart,onJuego,onOpen,onOpenJuego,onAnalisis,onAjustes,syncState}){
  const [nuevo,setNuevo]=useState("");
  const [rival,setRival]=useState("");
  const [liga,setLiga]=useState("");
  const [askJuego,setAskJuego]=useState(false);
  const ligas=Array.from(new Set(games.map(g=>g.liga).filter(Boolean)));
  const togglePos=j=>{
    const s=cfg.positions.indexOf(j)>=0?cfg.positions.filter(x=>x!==j):[...cfg.positions,j].sort((a,b)=>a-b);
    setCfg({...cfg,positions:s});
  };
  const puestos=cfg.positions.length;
  return (
    <div className="wrap">
      <div className="masthead">
        <div style={{display:"flex",alignItems:"center",gap:11}}>
          <Marca size={44}/>
          <div><h1 style={{fontSize:30}}>Entrenamiento<br/>de tiros</h1></div>
        </div>
        <button className={"sync"+(syncState==="on"?" on":syncState==="pend"?" pend":"")} onClick={onAjustes}>
          {syncState==="on"?"Drive activo":syncState==="pend"?"Por subir":"Solo este equipo"}
        </button>
      </div>

      <div className="courtbox"><Court sel={cfg.positions}/></div>

      <div className="card">
        <h2>Entrenamiento de hoy</h2>
        <p className="hint" style={{marginBottom:10}}>Las cinco líneas se recorren completas. Elige qué posiciones entran hoy.</p>
        <div className="posrow">
          {POS.map((p,j)=>(
            <button key={p} className={"posbtn"+(cfg.positions.indexOf(j)>=0?" on":"")} onClick={()=>togglePos(j)}>{p}</button>
          ))}
        </div>
        <div className="stepper" style={{marginTop:16}}>
          <button className="step-btn" onClick={()=>setCfg({...cfg,target:Math.max(1,cfg.target-1)})}>−</button>
          <div className="step-val">{cfg.target}</div>
          <button className="step-btn" onClick={()=>setCfg({...cfg,target:Math.min(20,cfg.target+1)})}>+</button>
          <div className="step-side">encestes por posición<br/>{puestos*5} posiciones · {puestos*5*cfg.target} encestes</div>
        </div>
      </div>

      <div className="card">
        <h2>¿Quién tira?</h2>
        <div className="chips">
          {players.map(p=><button key={p} className={"chip"+(p===playerId?" on":"")} onClick={()=>setPlayerId(p)}>{p}</button>)}
          {!players.length&&<p className="hint">Agrega al primer jugador para empezar.</p>}
        </div>
        <div className="newrow">
          <input type="text" value={nuevo} placeholder="Nombre" onChange={e=>setNuevo(e.target.value)}
                 onKeyDown={e=>{if(e.key==="Enter"){addPlayer(nuevo);setNuevo("")}}}/>
          <button className="chip ghost" onClick={()=>{addPlayer(nuevo);setNuevo("")}}>Agregar</button>
        </div>
      </div>

      <button className="btn btn-primary" disabled={!playerId||!puestos} onClick={onStart}>
        {puestos?`Iniciar en A${cfg.positions[0]+1}`:"Elige al menos una posición"}
      </button>
      <button className="btn btn-quiet" onClick={()=>setAskJuego(true)} disabled={!playerId}>Capturar un partido</button>
      <button className="btn btn-quiet" onClick={onAnalisis}>Ver análisis de todos</button>

      {askJuego&&
        <div className="sheet" onClick={()=>setAskJuego(false)}>
          <div className="sheet-in" onClick={e=>e.stopPropagation()}>
            <h2>Partido de {playerId}</h2>
            <p className="hint" style={{marginBottom:10}}>Se capturan los tiros de una sola jugadora.</p>
            <input type="text" value={rival} placeholder="Contra quién juegan"
                   onChange={e=>setRival(e.target.value)} style={{width:"100%"}}/>
            <input type="text" value={liga} placeholder="Liga o torneo" style={{width:"100%",marginTop:8}}
                   onChange={e=>setLiga(e.target.value)}/>
            {!!ligas.length&&
              <div className="chips" style={{marginTop:8}}>
                {ligas.map(l=><button key={l} className={"chip"+(liga===l?" on":"")} onClick={()=>setLiga(l)}>{l}</button>)}
              </div>}
            <button className="btn btn-primary" style={{marginTop:12}}
                    onClick={()=>{setAskJuego(false);onJuego(rival.trim()||"Rival",liga.trim()||"Sin liga")}}>Empezar el partido</button>
            <button className="btn btn-quiet" onClick={()=>setAskJuego(false)}>Cancelar</button>
          </div>
        </div>}

      {!!games.length&&
        <div className="card" style={{marginTop:22}}>
          <h2>Últimos partidos</h2>
          {games.slice(0,8).map(g=>{
            const b=boxScore(g.shots);
            return (
              <button key={g.id} className="hist" onClick={()=>onOpenJuego(g)}>
                <span className="hist-pct" style={{color:"var(--accent)"}}>{b.pts}</span>
                <span className="hist-main">
                  <b>{g.playerName} vs {g.rival}</b>
                  <span>{fecha(g.startedAt)} · {b.tc.m}/{b.tc.t} de campo{g.liga?" · "+g.liga:""}</span>
                </span>
              </button>
            );
          })}
        </div>}

      {!!sessions.length&&
        <div className="card" style={{marginTop:22}}>
          <h2>Últimas jornadas</h2>
          {sessions.slice(0,14).map(s=>{
            const st=sessionStats(s);
            return (
              <button key={s.id} className="hist" onClick={()=>onOpen(s)}>
                <span className="hist-pct" style={{color:heat(st.all.t?st.all.m/st.all.t:0)}}>{pct(st.all.m,st.all.t)??"—"}%</span>
                <span className="hist-main">
                  <b>{s.playerName}</b>
                  <span>{fecha(s.startedAt)} · pos {(s.positions||[]).map(p=>p+1).join(", ")}{st.ft.t?" + TL":""}</span>
                </span>
              </button>
            );
          })}
        </div>}
    </div>
  );
}

/* ---------- captura ---------- */
function Capture({session,setSession,onFinish,onAbort,record}){
  const plan=useMemo(()=>{
    const p=[]; LINES.forEach((_,i)=>session.positions.forEach(j=>p.push({line:i,pos:j}))); return p;
  },[session.positions]);

  const [order,setOrder]=useState(()=>plan.map((_,i)=>i));
  const [cursor,setCursor]=useState(0);
  const [skipped,setSkipped]=useState([]);
  const [ftPhase,setFtPhase]=useState(false);
  const [tlLibre,setTlLibre]=useState(false);
  const [marca10,setMarca10]=useState(null);
  const [paused,setPaused]=useState(false);
  const [tick,setTick]=useState(0);
  const [ask,setAsk]=useState(null);
  const lastT=useRef(null), pausedAcc=useRef(0), pauseStart=useRef(null), lockT=useRef(0), wake=useRef(null);

  const spot = ftPhase?{line:5,pos:0}:plan[order[cursor]];
  const target = ftPhase?session.ftTarget:session.target;
  const cur = session.shots.filter(s=>s.line===spot.line&&s.pos===spot.pos);
  const hechos=cur.length, mCur=cur.filter(s=>s.made).length;
  const listo=mCur>=target && !(ftPhase&&tlLibre);
  const ultimo=hechos?cur[hechos-1]:null;
  let rachaViva=0; for(let i=hechos-1;i>=0;i--){ if(cur[i].made) rachaViva++; else break; }
  let rr=0,rachaMax=0; cur.forEach(s=>{ if(s.made){rr++;rachaMax=Math.max(rachaMax,rr)} else rr=0 });
  const etiqueta = ftPhase?"tiros libres":LINES[spot.line]+(spot.pos+1);

  useEffect(()=>{let a=true;(async()=>{try{if(navigator.wakeLock){const w=await navigator.wakeLock.request("screen");a?wake.current=w:w.release()}}catch(e){}})();
    return()=>{a=false;try{wake.current&&wake.current.release()}catch(e){}}},[]);
  useEffect(()=>{if(!paused)return;const t=setInterval(()=>setTick(x=>x+1),500);return()=>clearInterval(t)},[paused]);
  useEffect(()=>{
    if(!listo) return;
    if(ftPhase){ setMarca10({m:mCur,t:hechos}); setAsk("tlDiez"); }
    else setAsk("confirm");
  },[listo]);
  useEffect(()=>{
    if(ftPhase&&tlLibre&&ultimo&&!ultimo.made) setAsk("tlFin");
  },[ftPhase,tlLibre,ultimo]);

  const tirar=useCallback(made=>{
    if(listo||paused||ask)return;
    const now=Date.now();
    if(now-lockT.current<260)return;
    lockT.current=now;
    const gap=(hechos>0&&lastT.current)?(now-lastT.current-pausedAcc.current):null;
    lastT.current=now; pausedAcc.current=0;
    buzz(made?28:[14,55,14]);
    setSession(s=>({...s,shots:[...s.shots,{line:spot.line,pos:spot.pos,made,t:now,gap}]}));
  },[listo,paused,ask,hechos,spot,setSession]);

  const siguiente=pendientes=>{
    setAsk(null); lastT.current=null; pausedAcc.current=0;
    if(cursor<order.length-1){setCursor(cursor+1);return}
    if(pendientes.length){setAsk("pendientes");return}
    setAsk("preguntaTL");
  };
  const avanzar=()=>{
    if(ftPhase){setAsk(null);onFinish();return}
    const p=skipped.filter(x=>x!==order[cursor]);
    setSkipped(p); siguiente(p);
  };
  const cerrar=()=>{
    const p=skipped.filter(x=>x!==order[cursor]);
    setSkipped(p); siguiente(p);
  };
  const omitir=()=>{
    const i=order[cursor];
    const p=skipped.indexOf(i)>=0?skipped:[...skipped,i];
    setSkipped(p); siguiente(p);
  };
  const retomar=()=>{
    setOrder(skipped.slice()); setCursor(0); setAsk(null);
    lastT.current=null; pausedAcc.current=0;
  };
  const togglePausa=()=>{
    if(paused){pausedAcc.current+=Date.now()-(pauseStart.current||Date.now());setPaused(false)}
    else{pauseStart.current=Date.now();setPaused(true)}
  };

  const done=useMemo(()=>{
    const d={};
    plan.forEach(sp=>{
      const c=session.shots.filter(s=>s.line===sp.line&&s.pos===sp.pos);
      if(c.filter(x=>x.made).length>=session.target) d[sp.line+"-"+sp.pos]=true;
    });
    return d;
  },[session.shots,plan,session.target]);

  const st=sessionStats(session);
  const nx = (!ftPhase&&cursor<order.length-1)?plan[order[cursor+1]]:null;
  const sig = nx?LINES[nx.line]+(nx.pos+1):"el cierre";

  return (
    <div className="cap">
      <div className="cap-top">
        <div className="cap-court"><Court line={ftPhase?null:spot.line} pos={spot.pos} sel={session.positions} done={done} ft={ftPhase} compact/></div>
        <div className="cap-id">
          <div className="big">{ftPhase?"Tiros libres":<React.Fragment>{LINES[spot.line]}<span style={{color:"var(--accent)"}}>{spot.pos+1}</span></React.Fragment>}</div>
          <div className="sub">{ftPhase&&tlLibre
            ? `racha viva: ${rachaViva} seguidos`
            : `${mCur} de ${target} encestes · ${ftPhase?session.playerName:`punto ${cursor+1} de ${order.length}`}`}</div>
          <div className="pips">
            {Array.from({length:Math.min(target,12)}).map((_,i)=><span key={i} className={"pip"+(i<mCur?" m":"")}/>)}
            {mCur>Math.min(target,12)&&<span style={{color:"var(--ink-soft)",fontSize:11.5,marginLeft:2}}>+{mCur-Math.min(target,12)}</span>}
          </div>
          {hechos>mCur&&
            <div className="pips fail">
              {Array.from({length:Math.min(hechos-mCur,12)}).map((_,i)=><span key={i} className="pip x"/>)}
              {hechos-mCur>12&&<span style={{color:"var(--ink-soft)",fontSize:11.5,marginLeft:2}}>+{hechos-mCur-12}</span>}
            </div>}
        </div>
        <div className="cap-run">
          <div className="r1">{mCur}/{hechos}</div>
          <div className="r2">{ftPhase?"esta tanda":"esta posición"}</div>
          <div className="r3">{st.all.m}/{st.all.t}</div>
          <div className="r2">jornada</div>
        </div>
      </div>

      <div className="halves">
        <button className="half made" onClick={()=>tirar(true)} aria-label="Anotó">
          <span className="lbl">Anotó</span>
          <span className="cnt">{ftPhase&&tlLibre?`${rachaViva} seguidos`:`faltan ${Math.max(0,target-mCur)}`}</span>
        </button>
        <button className="half miss" onClick={()=>tirar(false)} aria-label="Falló">
          <span className="cnt">{hechos-mCur} fallado{hechos-mCur===1?"":"s"}</span><span className="lbl">Falló</span>
        </button>
      </div>

      <div className="cap-bar">
        <button onClick={togglePausa}>Pausa</button>
        <button onClick={()=>setAsk(ftPhase?"exit":"omitir")}>{ftPhase?"Finalizar":"Omitir punto"}</button>
        <button onClick={()=>setAsk("exit")}>Terminar</button>
      </div>

      {paused&&
        <div className="pause">
          <div className="p1">En pausa</div>
          <div className="p2">El reloj no corre. Recupera el balón sin prisa.</div>
          <div className="p3">{mmss(Date.now()-(pauseStart.current||Date.now())+tick*0)}</div>
          <button onClick={togglePausa}>Reanudar {etiqueta}</button>
        </div>}

      {ask==="confirm"&&
        <div className="sheet"><div className="sheet-in">
          <h2>{ftPhase?"Tiros libres completos":`Posición ${etiqueta} completa`}</h2>
          <div className="score-line">
            <span className="big">{pct(mCur,hechos)}%</span>
            <span className="side">{mCur} encestes en {hechos} tiros</span>
          </div>
          <button className="btn btn-primary" onClick={avanzar}>
            {ftPhase?"Ver resultados":`Confirmar y pasar a ${sig}`}
          </button>
        </div></div>}

      {ask==="omitir"&&
        <div className="sheet"><div className="sheet-in">
          <h2>¿Cerrar {etiqueta} aquí?</h2>
          <div className="score-line">
            <span className="big">{hechos?pct(mCur,hechos)+"%":"—"}</span>
            <span className="side">{mCur} encestes en {hechos} tiros</span>
          </div>
          <button className="btn btn-primary" onClick={cerrar}>Dejarlo así y seguir</button>
          <button className="btn btn-quiet" onClick={omitir}>Retomarlo al final</button>
          <button className="btn btn-quiet" onClick={()=>setAsk(null)}>Seguir tirando aquí</button>
        </div></div>}

      {ask==="pendientes"&&
        <div className="sheet"><div className="sheet-in">
          <h2>Quedaron {skipped.length} punto{skipped.length===1?"":"s"} pendiente{skipped.length===1?"":"s"}</h2>
          <p className="hint">{skipped.map(i=>LINES[plan[i].line]+(plan[i].pos+1)).join(" · ")}</p>
          <button className="btn btn-primary" style={{marginTop:14}} onClick={retomar}>Retomar pendientes</button>
          <button className="btn btn-quiet" onClick={()=>setAsk("preguntaTL")}>Dejarlos así y continuar</button>
        </div></div>}

      {ask==="preguntaTL"&&
        <div className="sheet"><div className="sheet-in">
          <h2>¿Cierran con tiros libres?</h2>
          <p className="hint">Se miden los primeros {session.ftTarget} encestes. Si trae buena racha, puede seguir tirando después.</p>
          {record&&
            <div className="record"><span className="r">{record.racha}</span>
              <span className="d">seguidos es la mejor marca de {session.playerName}<br/>{fecha(record.fecha)}</span></div>}
          <button className="btn btn-primary" style={{marginTop:14}}
                  onClick={()=>{setAsk(null);setFtPhase(true);lastT.current=null;pausedAcc.current=0}}>
            Sí, {session.ftTarget} tiros libres
          </button>
          <button className="btn btn-quiet" onClick={onFinish}>Hoy no, terminar aquí</button>
        </div></div>}

      {ask==="tlDiez"&&
        <div className="sheet"><div className="sheet-in">
          <h2>{session.ftTarget} encestes logrados</h2>
          <div className="score-line">
            <span className="big">{marca10?pct(marca10.m,marca10.t):0}%</span>
            <span className="side">{marca10&&marca10.m} encestes en {marca10&&marca10.t} tiros</span>
          </div>
          {record&&<p className="hint" style={{marginBottom:12}}>Mejor marca: {record.racha} seguidos · {fecha(record.fecha)}</p>}
          <button className="btn btn-primary" onClick={()=>{setTlLibre(true);setAsk(null)}}>Seguir tirando</button>
          <button className="btn btn-quiet" onClick={onFinish}>Terminar aquí</button>
          <p className="hint" style={{marginTop:10}}>Este porcentaje ya quedó guardado. Lo que siga se mide aparte, como racha.</p>
        </div></div>}

      {ask==="tlFin"&&
        <div className="sheet"><div className="sheet-in">
          <h2>Racha de {rachaMax} seguidos</h2>
          {record&&rachaMax>record.racha
            ? <p className="hint" style={{color:"var(--gold)"}}>Nueva mejor marca. La anterior era {record.racha}.</p>
            : record && <p className="hint">Su mejor marca sigue siendo {record.racha}, del {fecha(record.fecha)}.</p>}
          <p className="hint" style={{marginTop:8}}>Van {hechos} tiros libres en total, {mCur} encestados.</p>
          <button className="btn btn-primary" style={{marginTop:14}} onClick={onFinish}>Terminar la jornada</button>
          <button className="btn btn-quiet" onClick={()=>setAsk(null)}>Seguir tirando</button>
        </div></div>}

      {ask==="exit"&&
        <div className="sheet"><div className="sheet-in">
          <h2>¿Terminar aquí?</h2>
          <p className="hint">Se guardan los {st.all.t} tiros capturados. Las posiciones que falten quedan vacías.</p>
          <button className="btn btn-primary" style={{marginTop:14}} onClick={onFinish}>Guardar y ver resultados</button>
          <button className="btn btn-quiet" onClick={()=>setAsk(null)}>Seguir tirando</button>
          <button className="btn btn-danger" onClick={onAbort}>Descartar la jornada</button>
        </div></div>}
    </div>
  );
}

/* ---------- bloques de análisis ---------- */
function Heat({shots,target,onPick}){
  const cel=(i,j)=>agg(shots,s=>s.line===i&&s.pos===j);
  const fila=i=>agg(shots,s=>s.line===i);
  const col=j=>agg(shots,s=>s.pos===j);
  const tot=agg(shots,()=>true);
  const Tot=({d,gt})=> d.t
    ? <div className={"cell "+(gt?"gt":"tot")}><div className="v">{pct(d.m,d.t)}%</div><div className="s">{d.m}/{d.t}</div></div>
    : <div className="cell empty"><div className="v">—</div><div className="s">&nbsp;</div></div>;
  return (
    <table className="grid">
      <thead><tr><th></th>{POS.map(p=><th key={p}>{p}</th>)}<th className="tot">Prom</th></tr></thead>
      <tbody>
        {LINES.map((L,i)=>(
          <tr key={L}>
            <th>{L}</th>
            {POS.map((_,j)=>{
              const c=cel(i,j);
              if(!c.t) return <td key={j}><div className="cell empty"><div className="v">—</div><div className="s">&nbsp;</div></div></td>;
              return <td key={j}><button className="cellbtn" onClick={()=>onPick&&onPick(i,j)}>
                <div className="cell" style={{background:heat(c.m/c.t)}}>
                <div className="v">{pct(c.m,c.t)}%</div>
                <div className="s">{c.m}/{c.t}{target&&c.m<target?" *":""}</div></div></button></td>;
            })}
            <td><Tot d={fila(i)}/></td>
          </tr>
        ))}
        <tr>
          <th className="tot">Prom</th>
          {POS.map((_,j)=><td key={j}><Tot d={col(j)}/></td>)}
          <td><Tot d={tot} gt/></td>
        </tr>
      </tbody>
    </table>
  );
}

/* ---------- evolución por periodo ---------- */
function bucketKey(iso,modo){
  const d=new Date(iso);
  if(modo==="mes") return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(modo==="semana"){
    const x=new Date(d); x.setHours(0,0,0,0);
    x.setDate(x.getDate()-((x.getDay()+6)%7));
    return "w"+x.toISOString().slice(0,10);
  }
  return d.toISOString().slice(0,10);
}
function bucketLabel(k,modo){
  if(modo==="mes"){ const [y,m]=k.split("-");
    return new Date(Number(y),Number(m)-1,1).toLocaleDateString("es-MX",{month:"short",year:"2-digit"}); }
  const iso = modo==="semana"? k.slice(1):k;
  const d=new Date(iso+"T12:00:00");
  const t=d.toLocaleDateString("es-MX",{day:"2-digit",month:"short"});
  return modo==="semana"? "sem "+t : t;
}
function Evolucion({sessions,player}){
  const [eje,setEje]=useState("linea");
  const [modo,setModo]=useState("dia");
  const mias=useMemo(()=>sessions.filter(s=>s.playerName===player),[sessions,player]);

  const cubos=useMemo(()=>{
    const m={};
    mias.forEach(s=>{
      const k=bucketKey(s.startedAt,modo);
      (m[k]=m[k]||[]).push(...s.shots.filter(x=>!isFT(x)));
    });
    return Object.keys(m).sort().slice(-5).map(k=>({k,label:bucketLabel(k,modo),shots:m[k]}));
  },[mias,modo]);

  const filas = eje==="linea"?LINES:POS.map(String);
  const filtro=(s,i)=> eje==="linea"? s.line===i : s.pos===i;
  const todos = cubos.reduce((a,c)=>a.concat(c.shots),[]);

  if(!cubos.length) return <p className="hint">Todavía no hay jornadas para comparar.</p>;

  return (
    <React.Fragment>
      <div className="chips" style={{marginBottom:8}}>
        <button className={"chip"+(eje==="linea"?" on":"")} onClick={()=>setEje("linea")}>Línea</button>
        <button className={"chip"+(eje==="posicion"?" on":"")} onClick={()=>setEje("posicion")}>Posición</button>
      </div>
      <div className="chips" style={{marginBottom:12}}>
        {[["dia","Día"],["semana","Semana"],["mes","Mes"]].map(([v,l])=>
          <button key={v} className={"chip"+(modo===v?" on":"")} onClick={()=>setModo(v)}>{l}</button>)}
      </div>
      <div style={{overflowX:"auto"}}>
      <table className="tbl">
        <thead><tr><th className="rowh"></th>
          {cubos.map(c=><th key={c.k}>{c.label}</th>)}
          <th className="tot">Prom</th></tr></thead>
        <tbody>
          {filas.map((L,i)=>{
            const f=agg(todos,s=>filtro(s,i));
            return (
              <tr key={L}>
                <th className="rowh">{L}</th>
                {cubos.map((c,ci)=>{
                  const d=agg(c.shots,s=>filtro(s,i));
                  return <td key={c.k} className={ci===cubos.length-1?"last":""}>{d.t?pct(d.m,d.t):"—"}</td>;
                })}
                <td className="tot">{f.t?pct(f.m,f.t):"—"}</td>
              </tr>
            );
          })}
          <tr className="totrow">
            <th className="rowh tot">Prom</th>
            {cubos.map(c=>{
              const d=agg(c.shots,()=>true);
              return <td key={c.k}>{d.t?pct(d.m,d.t):"—"}</td>;
            })}
            <td className="gt">{todos.length?pct(todos.filter(s=>s.made).length,todos.length):"—"}</td>
          </tr>
        </tbody>
      </table>
      </div>
      <p className="hint" style={{marginTop:10}}>Últimos {cubos.length} periodos de {player}. El promedio de la derecha
        es de lo que se ve, y sale de sumar encestes y tiros, no de promediar porcentajes.</p>
    </React.Fragment>
  );
}
function Lineas({shots}){
  return LINES.map((L,i)=>{
    const c=agg(shots,s=>s.line===i), p=c.t?c.m/c.t:0;
    return (
      <div className="bar-row" key={L}>
        <span className="k">{L}</span>
        <span className="bar-track"><span className="bar-fill" style={{width:(c.t?p*100:0)+"%",background:heat(p)}}/></span>
        <span className="v">{c.t?pct(c.m,c.t)+"%":"—"}</span>
      </div>
    );
  });
}

/* ---------- resumen de jornada ---------- */
function Summary({session,sessions,onHome,toast,record}){
  const [det,setDet]=useState(null);
  const st=sessionStats(session);
  const tl=ftSplit(session.shots,session.ftTarget||10);
  const tiros=session.shots.filter(s=>!isFT(s));
  const mapa=useMemo(()=>{
    const o={}; tiros.forEach(s=>{ const k=s.line+"-"+s.pos; (o[k]=o[k]||{m:0,t:0}); o[k].t++; if(s.made)o[k].m++; });
    return o;
  },[session.shots]);
  const dShots = det? tiros.filter(s=>s.line===det.line&&s.pos===det.pos):[];
  const dM = dShots.filter(s=>s.made).length;
  const gaps=session.shots.map(s=>s.gap).filter(g=>typeof g==="number"&&g>0&&g<120000);
  const ritmo=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length/1000:null;
  let r=0,best=0; session.shots.forEach(s=>{if(s.made){r++;best=Math.max(best,r)}else r=0});

  const csv=()=>{
    const head="jugador,jornada_id,fecha,fase,linea,posicion,intento,enceste,segundos_desde_tiro_anterior";
    const c={};
    return head+"\n"+session.shots.map(s=>{
      const k=s.line+"-"+s.pos; c[k]=(c[k]||0)+1;
      return [JSON.stringify(session.playerName),session.id,new Date(s.t).toISOString(),
        isFT(s)?"TL":"LINEA", isFT(s)?"":LINES[s.line], isFT(s)?"":s.pos+1, c[k], s.made?1:0,
        typeof s.gap==="number"?(s.gap/1000).toFixed(2):""].join(",");
    }).join("\n");
  };
  const bajar=async()=>{
    const nombre=`tiros_${String(session.playerName).replace(/\s+/g,"_")}_${String(session.startedAt).slice(0,10)}.csv`;
    let dl=null; try{ dl = window.claude ? await window.claude.use("downloads") : null; }catch(e){}
    if(dl){try{await dl.save({filename:nombre,data:csv()});toast("CSV guardado.");return}catch(e){if(e&&e.code==="declined")return}}
    try{await navigator.clipboard.writeText(csv());toast("CSV copiado al portapapeles.")}catch(e){toast("No se pudo exportar aquí.")}
  };

  return (
    <div className="wrap">
      <div className="masthead"><div><h1>{session.playerName}</h1><p>{fecha(session.startedAt)}</p></div></div>
      <div className="card">
        <div className="headline">
          <span className="pct">{pct(st.tiro.m,st.tiro.t)??0}%</span>
          <span className="meta">{st.tiro.m} encestes<br/>en {st.tiro.t} tiros</span>
        </div>
        <div className="stats" style={{marginTop:10}}>
          <div className="stat"><div className="n">{tl.first.t?pct(tl.first.m,tl.first.t)+"%":"—"}</div><div className="l">primeros {session.ftTarget||10} libres {tl.first.t?`(${tl.first.m}/${tl.first.t})`:""}</div></div>
          <div className="stat"><div className="n">{ritmo?ritmo.toFixed(1)+"s":"—"}</div><div className="l">entre tiros</div></div>
          <div className="stat"><div className="n">{tl.racha||"—"}</div><div className="l">racha en libres{tl.extra.t?` (+${tl.extra.t} extra)`:""}</div></div>
        </div>
        {record&&tl.racha>record.racha&&
          <div className="record" style={{marginBottom:0}}><span className="r">{tl.racha}</span>
            <span className="d">nueva mejor marca en tiros libres<br/>la anterior era {record.racha}, del {fecha(record.fecha)}</span></div>}
      </div>
      <div className="card">
        <h2>Efectividad por posición</h2>
        <Heat shots={tiros} target={session.target} onPick={(i,j)=>setDet({line:i,pos:j})}/>
        <p className="hint" style={{marginTop:10}}>Encestes entre tiros realizados. La posición 1 es la más cercana al aro.
          El asterisco marca los puntos que se omitieron sin llegar a los {session.target} encestes.</p>
      </div>
      <div className="card">
        <h2>Mapa de la jornada</h2>
        <Court mapa={mapa} onPick={(i,j)=>setDet({line:i,pos:j})}/>
        <p className="hint" style={{marginTop:6}}>Toca cualquier punto para ver su detalle.</p>
      </div>

      <div className="card">
        <h2>Evolución</h2>

      <button className="btn btn-quiet" onClick={bajar}>Descargar CSV de esta jornada</button>
      <button className="btn btn-primary" onClick={onHome}>Volver al inicio</button>

      {det&&
        <div className="sheet" onClick={()=>setDet(null)}>
          <div className="sheet-in" onClick={e=>e.stopPropagation()}>
            <h2>Punto {LINES[det.line]}{det.pos+1}</h2>
            <div className="score-line">
              <span className="big" style={{color:dShots.length?heat(dM/dShots.length):"var(--ink-soft)"}}>
                {dShots.length?pct(dM,dShots.length)+"%":"—"}</span>
              <span className="side">{dM} encestes<br/>en {dShots.length} tiros</span>
            </div>
            {!!dShots.length&&<>
              <div className="pips">{dShots.map((s,i)=><span key={i} className={"pip "+(s.made?"m":"x")}/>)}</div>
              <p className="hint" style={{margin:"6px 0 14px"}}>Secuencia en orden de tiro.</p>
              <div className="stats">
                <div className="stat"><div className="n">{ritmoDe(dShots)?ritmoDe(dShots).toFixed(1)+"s":"—"}</div><div className="l">entre tiros</div></div>

              </div>
            </>}
            {!dShots.length&&<p className="hint">Este punto no se entrenó en esta jornada.</p>}
            <button className="btn btn-primary" style={{marginTop:14}} onClick={()=>setDet(null)}>Cerrar</button>
          </div>
        </div>}
    </div>
  );
}

/* ---------- partido: captura ---------- */
function Juego({game,setGame,onFinish,onAbort}){
  const [per,setPer]=useState(1);
  const [pend,setPend]=useState(null);
  const [ask,setAsk]=useState(null);
  const wake=useRef(null);

  useEffect(()=>{let a=true;(async()=>{try{if(navigator.wakeLock){const w=await navigator.wakeLock.request("screen");a?wake.current=w:w.release()}}catch(e){}})();
    return()=>{a=false;try{wake.current&&wake.current.release()}catch(e){}}},[]);

  const tocar=e=>{
    const r=e.currentTarget.getBoundingClientRect();
    const x=(e.clientX-r.left)*(328/r.width), y=(e.clientY-r.top)*(392/r.height);
    if(x<8||x>320||y<28||y>362) return;
    setPend({x:Math.round(x*10)/10,y:Math.round(y*10)/10,zona:zonaDe(x,y),foul:false,res:null,ftM:0,ftA:0});
    buzz(12);
  };

  const guardar=s=>{
    setGame(g=>({...g,shots:[...g.shots,{...s,periodo:per,t:Date.now()}]}));
    setPend(null); buzz(s.made?28:[14,55,14]);
  };
  const resultado=made=>{
    const s={...pend,made};
    if(!pend.foul) return guardar(s);
    const libres = made?1:(esTriple(pend.zona)?3:2);
    setPend({...s,ftA:libres,ftM:libres});
  };
  const deshacer=()=>setGame(g=>({...g,shots:g.shots.slice(0,-1)}));

  const bs=boxScore(game.shots);
  const esperaLibres = pend&&pend.res!==null&&pend.foul&&pend.made!==undefined;

  return (
    <div className="cap">
      <div className="cap-top" style={{alignItems:"flex-start"}}>
        <div className="cap-id">
          <div className="big" style={{fontSize:22}}>{game.playerName} <span style={{color:"var(--ink-soft)",fontWeight:400,fontSize:15}}>vs {game.rival}</span></div>
          {game.liga&&<div className="sub">{game.liga}</div>}
          <div className="chips" style={{marginTop:8,gap:6}}>
            {[1,2,3,4,"PR"].map(p=>(
              <button key={p} className={"chip"+(per===p?" on":"")} style={{padding:"3px 11px",fontSize:13}}
                      onClick={()=>setPer(p)}>{p}</button>))}
          </div>
        </div>
        <div className="cap-run">
          <div className="r1">{bs.tc.m}/{bs.tc.t}</div>
          <div className="r2">{bs.pts} puntos</div>
        </div>
      </div>

      <div style={{flex:1,minHeight:0,overflow:"hidden",display:"flex",alignItems:"center",padding:"6px 10px"}}>
        <Court juego tiros={game.shots} marca={pend} onTap={tocar}/>
      </div>

      <div className="cap-bar">
        <button onClick={deshacer} disabled={!game.shots.length}>Deshacer</button>
        <button onClick={()=>setAsk("exit")}>Terminar</button>
      </div>

      {pend&&pend.ftA===0&&
        <div className="sheet" onClick={()=>setPend(null)}>
          <div className="sheet-in" onClick={e=>e.stopPropagation()}>
            <h2>{ZONA_NOM[pend.zona]}</h2>
            <p className="hint">{distM(pend.x,pend.y).toFixed(1)} m del aro · {esTriple(pend.zona)?"vale 3":"vale 2"}</p>
            <div style={{display:"flex",gap:8,margin:"14px 0 10px"}}>
              <button className="btn" style={{background:"var(--made)",color:"#fff"}} onClick={()=>resultado(true)}>Anotó</button>
              <button className="btn" style={{background:"var(--miss)",color:"#fff",marginTop:0}} onClick={()=>resultado(false)}>Falló</button>
            </div>
            <button className="btn btn-quiet" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}
                    onClick={()=>setPend({...pend,foul:!pend.foul})}>
              <span>Recibió falta</span>
              <span style={{width:44,height:26,borderRadius:20,background:pend.foul?"var(--gold)":"var(--line)",position:"relative",display:"inline-block"}}>
                <span style={{position:"absolute",top:3,left:pend.foul?21:3,width:20,height:20,borderRadius:"50%",background:"var(--surface)"}}/>
              </span>
            </button>
            <p className="hint" style={{marginTop:10}}>Toca otro lugar de la cancha para corregir la posición.</p>
          </div>
        </div>}

      {pend&&pend.ftA>0&&
        <div className="sheet"><div className="sheet-in">
          <h2>Tiros libres</h2>
          <p className="hint">{ZONA_NOM[pend.zona]} · {pend.made?"anotó con falta":"falló con falta"}</p>
          <div className="stepper" style={{marginTop:16}}>
            <button className="step-btn" onClick={()=>setPend({...pend,ftM:Math.max(0,pend.ftM-1)})}>−</button>
            <div className="step-val">{pend.ftM}</div>
            <button className="step-btn" onClick={()=>setPend({...pend,ftM:Math.min(pend.ftA,pend.ftM+1)})}>+</button>
            <div className="step-side">anotados<br/>de {pend.ftA} intento{pend.ftA===1?"":"s"}</div>
          </div>
          <div className="stepper" style={{marginTop:10}}>
            <button className="step-btn" onClick={()=>setPend({...pend,ftA:Math.max(1,pend.ftA-1),ftM:Math.min(pend.ftM,Math.max(1,pend.ftA-1))})}>−</button>
            <div className="step-val">{pend.ftA}</div>
            <button className="step-btn" onClick={()=>setPend({...pend,ftA:Math.min(4,pend.ftA+1)})}>+</button>
            <div className="step-side">intentos<br/>concedidos</div>
          </div>
          <button className="btn btn-primary" style={{marginTop:16}} onClick={()=>guardar(pend)}>
            Guardar la jugada · {puntosDe(pend)} punto{puntosDe(pend)===1?"":"s"}
          </button>
          <button className="btn btn-quiet" onClick={()=>setPend(null)}>Cancelar</button>
        </div></div>}

      {ask==="exit"&&
        <div className="sheet"><div className="sheet-in">
          <h2>¿Terminar el partido?</h2>
          <p className="hint">Se guardan {bs.tc.t} tiros y {bs.pts} puntos.</p>
          <button className="btn btn-primary" style={{marginTop:14}} onClick={onFinish}>Guardar y ver resultados</button>
          <button className="btn btn-quiet" onClick={()=>setAsk(null)}>Seguir capturando</button>
          <button className="btn btn-danger" onClick={onAbort}>Descartar el partido</button>
        </div></div>}
    </div>
  );
}

/* ---------- partido: resumen ---------- */
function JuegoResumen({game,games,onHome,toast}){

  const shots = fuente.reduce((a,g)=>a.concat(g.shots),[]);
  const bs=boxScore(shots), zs=porZona(shots);

  const csv=()=>{
    const head="jugador,partido_id,fecha,rival,liga,periodo,x,y,distancia_m,zona,triple,enceste,falta,tl_anotados,tl_intentos,puntos";
    return head+"\n"+game.shots.map(s=>[JSON.stringify(game.playerName),game.id,new Date(s.t).toISOString(),
      JSON.stringify(game.rival),JSON.stringify(game.liga||""),s.periodo,s.x,s.y,distM(s.x,s.y).toFixed(2),s.zona,esTriple(s.zona)?1:0,
      s.made?1:0,s.foul?1:0,s.ftM||0,s.ftA||0,puntosDe(s)].join(",")).join("\n");
  };
  const bajar=async()=>{
    const nombre=`partido_${String(game.playerName).replace(/\s+/g,"_")}_${String(game.startedAt).slice(0,10)}.csv`;
    let dl=null; try{ dl=window.claude?await window.claude.use("downloads"):null; }catch(e){}
    if(dl){try{await dl.save({filename:nombre,data:csv()});toast("CSV guardado.");return}catch(e){if(e&&e.code==="declined")return}}
    try{await navigator.clipboard.writeText(csv());toast("CSV copiado al portapapeles.")}catch(e){toast("No se pudo exportar aquí.")}
  };

  return (
    <div className="wrap">
      <div className="masthead"><div>
        <h1 style={{fontSize:30}}>{game.playerName}</h1>
        <p>vs {game.rival}{game.liga?" · "+game.liga:""}<br/>{fecha(game.startedAt)}</p>
      </div></div>

      <div className="card">
        <div className="chips" style={{marginBottom:12}}>
          <button className={"chip"+(vista==="partido"?" on":"")} onClick={()=>setVista("partido")}>Este partido</button>
          {game.liga&&<button className={"chip"+(vista==="liga"?" on":"")} onClick={()=>setVista("liga")}>{game.liga} · {deLiga.length}</button>}
          <button className={"chip"+(vista==="todos"?" on":"")} onClick={()=>setVista("todos")}>Todos · {suyos.length}</button>
        </div>
        <div className="headline">
          <span className="pct">{bs.pts}</span>
          <span className="meta">puntos<br/>{bs.pps.toFixed(2)} por tiro de campo</span>
        </div>
        <div className="stats" style={{marginTop:10}}>
          <div className="stat"><div className="n">{bs.tc.t?pct(bs.tc.m,bs.tc.t)+"%":"—"}</div><div className="l">campo {bs.tc.m}/{bs.tc.t}</div></div>
          <div className="stat"><div className="n">{bs.t3.t?pct(bs.t3.m,bs.t3.t)+"%":"—"}</div><div className="l">triples {bs.t3.m}/{bs.t3.t}</div></div>
          <div className="stat"><div className="n">{bs.tl.t?pct(bs.tl.m,bs.tl.t)+"%":"—"}</div><div className="l">libres {bs.tl.m}/{bs.tl.t}</div></div>
        </div>
      </div>

      <div className="card">
        <h2>Mapa de tiros</h2>
        <Court juego zonas={zs} tiros={shots}/>
        <p className="hint" style={{marginTop:6}}>Relleno, anotado. Hueco, fallado. El número de cada zona son encestes entre tiros;
          las zonas con menos de {MIN_ZONA} tiros quedan en gris porque su porcentaje todavía no es confiable.</p>
      </div>

      <div className="card">
        <h2>Por zona</h2>
        {ZONAS.map(z=>{
          const d=zs[z], p=d.t?d.m/d.t:0;
          return (
            <div className="bar-row" key={z}>
              <span style={{width:96,fontSize:13.5,lineHeight:1.25}}>{ZONA_NOM[z]}</span>
              <span className="bar-track"><span className="bar-fill" style={{width:(d.t?p*100:0)+"%",background:d.t>=MIN_ZONA?heat(p):"var(--line-strong)"}}/></span>
              <span className="v">{d.t?pct(d.m,d.t)+"%":"—"}</span>
              <span style={{width:42,fontSize:12,color:"var(--ink-soft)",textAlign:"right"}}>{d.m}/{d.t}</span>
            </div>
          );
        })}
      </div>

      <button className="btn btn-quiet" onClick={bajar}>Descargar CSV del partido</button>
      <button className="btn btn-primary" onClick={onHome}>Volver al inicio</button>
    </div>
  );
}

/* ---------- app ---------- */
function App(){
  const [players,setPlayers]=useState(()=>load(K_PLAYERS,[]));
  const [sessions,setSessions]=useState(()=>load(K_SESSIONS,[]));
  const [pending,setPending]=useState(()=>load(K_PEND,[]));
  const [games,setGames]=useState(()=>load(K_GAMES,[]));
  const [game,setGame]=useState(null);
  const [playerId,setPlayerId]=useState(()=>load(K_PLAYERS,[])[0]||null);
  const [cfg,setCfg]=useState(()=>load(K_CFG,{positions:[0,1,2,3,4],target:5,ftTarget:10}));
  const [screen,setScreen]=useState("home");
  const [session,setSession]=useState(null);
  const [msg,setMsg]=useState(null);
  const [online,setOnline]=useState(!!syncUrl());
  const toast=t=>{setMsg(t);setTimeout(()=>setMsg(null),2800)};

  useEffect(()=>{save(K_CFG,cfg)},[cfg]);

  const nombres=useMemo(()=>{
    const s=new Set(players); sessions.forEach(x=>s.add(x.playerName)); games.forEach(x=>s.add(x.playerName)); return Array.from(s);
  },[players,sessions,games]);

  const sincronizar=useCallback(async()=>{
    if(!syncUrl()){setOnline(false);return}
    setOnline(true);
    const cola=load(K_PEND,[]), quedan=[];
    for(const s of cola){ try{ await pushRemote(s); }catch(e){ quedan.push(s); } }
    setPending(quedan); save(K_PEND,quedan);
    try{
      const remotas=await pullRemote();
      if(remotas&&remotas.jornadas){ const m=mergeSessions(load(K_SESSIONS,[]),remotas.jornadas); setSessions(m); save(K_SESSIONS,m); }
      if(remotas&&remotas.juegos){ const g=mergeSessions(load(K_GAMES,[]),remotas.juegos); setGames(g); save(K_GAMES,g); }
    }catch(e){}
  },[]);
  useEffect(()=>{sincronizar()},[sincronizar]);

  const addPlayer=n=>{
    const v=(n||"").trim(); if(!v||nombres.indexOf(v)>=0){ if(v) setPlayerId(v); return; }
    const next=[...players,v]; setPlayers(next); save(K_PLAYERS,next); setPlayerId(v);
  };
  const start=()=>{
    if(!playerId||!cfg.positions.length)return;
    setSession({id:"s"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
      playerName:playerId, startedAt:new Date().toISOString(),
      positions:cfg.positions.slice(), target:cfg.target, ftTarget:cfg.ftTarget, shots:[]});
    setScreen("capture");
  };
  const startJuego=(rival,liga)=>{
    if(!playerId) return;
    setGame({id:"g"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
      playerName:playerId, rival, liga, startedAt:new Date().toISOString(), shots:[]});
    setScreen("juego");
  };
  const finishJuego=async()=>{
    const g={...game,endedAt:new Date().toISOString()};
    const next=mergeSessions([g],games); setGames(next); save(K_GAMES,next);
    setGame(g); setScreen("juegoResumen");
    if(syncUrl()){
      try{ await pushRemote(g); toast("Partido guardado en la hoja de Drive."); }
      catch(e){ const q=[...pending,g]; setPending(q); save(K_PEND,q); toast("Guardado en el teléfono. Se subirá al recuperar señal."); }
    }
  };
  const finish=async()=>{
    const s={...session,endedAt:new Date().toISOString()};
    const next=mergeSessions([s],sessions); setSessions(next); save(K_SESSIONS,next);
    setSession(s); setScreen("summary");
    if(syncUrl()){
      try{ await pushRemote(s); toast("Jornada guardada en la hoja de Drive."); }
      catch(e){ const q=[...pending,s]; setPending(q); save(K_PEND,q); toast("Guardada en el teléfono. Se subirá al recuperar señal."); }
    }
  };

  const record = session? marcaHistorica(sessions,session.playerName,session.id) : null;

  if(screen==="juego"&&game)
    return <Juego game={game} setGame={setGame} onFinish={finishJuego}
                  onAbort={()=>{setGame(null);setScreen("home")}}/>;

  if(screen==="capture"&&session)
    return <Capture session={session} setSession={setSession} onFinish={finish} record={record}
                    onAbort={()=>{setSession(null);setScreen("home")}}/>;

  const chrome=c=><React.Fragment>{c}{msg&&<div className="toast">{msg}</div>}</React.Fragment>;
  if(screen==="summary"&&session)
    return chrome(<Summary session={session} sessions={sessions} record={record} onHome={()=>{setSession(null);setScreen("home")}} toast={toast}/>);
  if(screen==="juegoResumen"&&game)
    return chrome(<JuegoResumen game={game} games={games} toast={toast}
                                onHome={()=>{setGame(null);setScreen("home")}}/>);
  if(screen==="analisis")
    return chrome(<Analisis sessions={sessions} players={nombres} onHome={()=>setScreen("home")}/>);
  if(screen==="ajustes")
    return chrome(<Ajustes onHome={()=>setScreen("home")} toast={toast} pendientes={pending.length} onSync={sincronizar}/>);
  return chrome(
    <Home players={nombres} addPlayer={addPlayer} playerId={playerId} setPlayerId={setPlayerId}
          cfg={cfg} setCfg={setCfg} sessions={sessions} games={games} onStart={start} onJuego={startJuego}
          onOpen={s=>{setSession(s);setScreen("summary")}}
          onOpenJuego={g=>{setGame(g);setScreen("juegoResumen")}}
          onAnalisis={()=>setScreen("analisis")} onAjustes={()=>setScreen("ajustes")}
          syncState={pending.length?"pend":online?"on":"off"}/>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
